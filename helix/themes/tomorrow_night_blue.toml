"markup.link.label" = "aqua"
"markup.quote" = "fg_muted"
"markup.raw" = "green"
"markup.raw.inline" = "green"
"markup.raw.block" = "green"
"diff.plus" = "diff_add"
"diff.plus.gutter" = "diff_add"
"diff.minus" = "diff_delete"
"diff.minus.gutter" = "diff_delete"
"diff.delta" = "diff_change"
"diff.delta.moved" = "purple"
"diff.delta.conflict" = "conflict"
"diff.delta.gutter" = "diff_change"
embedded = "fg"

"ui.background" = { fg = "fg", bg = "bg" }
"ui.background.separator" = { fg = "border" }
"ui.text" = { fg = "fg" }
"ui.text.focus" = { fg = "accent" }
"ui.text.inactive" = { fg = "fg_muted" }
"ui.text.info" = { fg = "fg_muted" }
"ui.text.directory" = { fg = "blue" }
"ui.text.symlink" = { fg = "aqua" }

"ui.virtual" = { fg = "fg_gutter" }
"ui.virtual.ruler" = { bg = "bg_highlight" }
"ui.virtual.whitespace" = { fg = "fg_gutter" }
"ui.virtual.indent-guide" = { fg = "indent_guide" }
"ui.virtual.inlay-hint" = { fg = "fg_muted", bg = "bg_panel" }
"ui.virtual.inlay-hint.parameter" = { fg = "fg_muted", bg = "bg_panel" }
"ui.virtual.inlay-hint.type" = { fg = "fg_muted", bg = "bg_panel" }
"ui.virtual.wrap" = { fg = "fg_gutter" }
"ui.virtual.jump-label" = { fg = "bg", bg = "accent" }

"ui.gutter" = { fg = "fg_gutter", bg = "bg" }
"ui.gutter.selected" = { fg = "fg_linenr_active", bg = "bg_highlight" }
"ui.linenr" = { fg = "fg_gutter" }
"ui.linenr.selected" = { fg = "fg_linenr_active" }

"ui.statusline" = { fg = "fg", bg = "bg_statusline" }
