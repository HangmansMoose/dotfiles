"keyword.control" = "purple"
"keyword.control.conditional" = "purple"
"keyword.control.repeat" = "purple"
"keyword.control.import" = "purple"
"keyword.control.return" = "purple"
"keyword.control.exception" = "purple"
"keyword.operator" = "purple"
"keyword.directive" = "purple"
"keyword.function" = "purple"
"keyword.storage" = "purple"
"keyword.storage.type" = "purple"
"keyword.storage.modifier" = "purple"
operator = "fg"
function = "aqua"
"function.builtin" = "aqua"
"function.method" = "aqua"
"function.macro" = "purple"
"function.special" = "aqua"
tag = "tag_color"
"tag.builtin" = "tag_color"
namespace = "type_color"
special = "yellow"
"markup.heading" = "purple"
"markup.heading.marker" = "fg_muted"
"markup.list" = "orange"
"markup.list.unnumbered" = "orange"
"markup.list.numbered" = "orange"
"markup.list.checked" = "green"
"markup.list.unchecked" = "fg_muted"
"markup.bold" = "fg"
"markup.italic" = "fg"
"markup.strikethrough" = "fg_muted"
"markup.link.url" = "string_color"
