# Tomorrow Night Blue
# Ported from the Zed "Tomorrow Night Blue" theme:
# https://github.com/biaqat/tomorrow-theme-zed
# All font styles/weights are normal — no bold or italic anywhere.

attribute = "yellow"
type = "type_color"
"type.builtin" = "type_color"
"type.enum.variant" = "type_color"
constructor = "purple"
constant = "orange"
"constant.builtin" = "const_builtin"
"constant.builtin.boolean" = "const_builtin"
"constant.character" = "orange"
"constant.character.escape" = "yellow"
"constant.numeric" = "orange"
"constant.numeric.integer" = "orange"
"constant.numeric.float" = "orange"
string = "string_color"
"string.regexp" = "yellow"
"string.special" = "yellow"
"string.special.path" = "string_color"
"string.special.url" = "string_color"
"string.special.symbol" = "orange"
comment = "fg_muted"
"comment.line" = "fg_muted"
"comment.block" = "fg_muted"
"comment.block.documentation" = "fg_muted"
"comment.line.documentation" = "fg_muted"
"comment.unused" = "fg_muted"
variable = "fg"
"variable.builtin" = "purple"
"variable.parameter" = "fg"
"variable.other.member" = "fg"
"variable.other.member.private" = "fg"
label = "blue"
