"ui.statusline.normal" = { fg = "bg", bg = "blue" }
"ui.statusline.insert" = { fg = "bg", bg = "green" }
"ui.statusline.select" = { fg = "bg", bg = "purple" }
"ui.statusline.separator" = { fg = "border" }

"ui.bufferline" = { fg = "fg_muted", bg = "bg_tab_inactive" }
"ui.bufferline.active" = { fg = "fg", bg = "bg_tab_active" }
"ui.bufferline.background" = { bg = "bg_tab_inactive" }

"ui.popup" = { fg = "fg", bg = "bg_menu" }
"ui.popup.info" = { fg = "fg", bg = "bg_menu" }
"ui.picker.header" = { fg = "fg_muted", bg = "bg_menu" }
"ui.picker.header.column" = { fg = "fg_muted" }
"ui.picker.header.column.active" = { fg = "accent" }
"ui.window" = { fg = "border" }
"ui.help" = { fg = "fg", bg = "bg_menu" }

"ui.menu" = { fg = "fg", bg = "bg_menu" }
"ui.menu.selected" = { fg = "bg", bg = "accent" }
"ui.menu.scroll" = { fg = "accent", bg = "bg_menu" }

"ui.selection" = { bg = "bg_selection" }
"ui.selection.primary" = { bg = "bg_selection" }
"ui.highlight" = { bg = "bg_highlight" }
"ui.highlight.frameline" = { bg = "bg_highlight" }

"ui.cursor" = { fg = "bg", bg = "cursor" }
"ui.cursor.normal" = { fg = "bg", bg = "cursor" }
"ui.cursor.insert" = { fg = "bg", bg = "green" }
"ui.cursor.select" = { fg = "bg", bg = "purple" }
"ui.cursor.match" = { fg = "bg", bg = "yellow" }
"ui.cursor.primary" = { fg = "bg", bg = "cursor" }
"ui.cursor.primary.normal" = { fg = "bg", bg = "cursor" }
"ui.cursor.primary.insert" = { fg = "bg", bg = "green" }
"ui.cursor.primary.select" = { fg = "bg", bg = "purple" }

"ui.cursorline.primary" = { bg = "bg_highlight" }
"ui.cursorline.secondary" = { bg = "bg_highlight" }
"ui.cursorcolumn.primary" = { bg = "bg_highlight" }
"ui.cursorcolumn.secondary" = { bg = "bg_highlight" }

"ui.debug.breakpoint" = { fg = "red" }
"ui.debug.active" = { fg = "yellow" }

warning = "yellow"
"warning.diagnostic.inline" = { fg = "fg", bg = "bg" }
error = "red"
"error.diagnostic.inline" = { fg = "fg", bg = "bg" }
info = "blue"
"info.diagnostic.inline" = { fg = "fg", bg = "bg" }
hint = "fg_muted"
"hint.diagnostic.inline" = { fg = "fg", bg = "bg" }

diagnostic = { underline = { color = "fg_muted", style = "dotted" } }
"diagnostic.hint" = { underline = { color = "fg_muted", style = "dotted" } }
"diagnostic.info" = { underline = { color = "blue", style = "dotted" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.unnecessary" = { fg = "fg_muted" }
"diagnostic.deprecated" = { fg = "fg_muted" }

tabstop = { bg = "bg_highlight" }

rainbow = ["blue", "purple", "green", "orange", "aqua", "yellow", "tag_color"]

