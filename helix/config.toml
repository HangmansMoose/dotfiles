theme = "luna"

[editor]
true-color = true
cursorline = true
bufferline = "multiple"
color-modes = true
line-number = "relative"
gutters = ["diagnostics", "spacer" , "line-numbers", "spacer"]
auto-format = false

[editor.cursor-shape]
insert = "bar"
normal = "block"

[editor.file-picker]
hidden = false

[keys.normal.space]
"m" = ":run-shell-command build.bat"
"M" = ":run-shell-command debug.bat"
